services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - MONGO_URI=mongodb://mongo:27017/engine-nvh
      - PYTHON_PATH=/opt/venv/bin/python3
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
